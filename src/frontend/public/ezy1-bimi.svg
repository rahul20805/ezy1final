<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A00" />
      <stop offset="0.5" stop-color="#FF5100" />
      <stop offset="1" stop-color="#E53935" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF500" />
      <stop offset="1" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle depth shadow -->
  <rect x="24" y="28" width="464" height="464" rx="112" fill="#B71C1C" opacity="0.35" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Gloss overlay -->
  <path d="M 24 136 C 24 74, 74 24, 136 24 L 376 24 C 438 24, 488 74, 488 136 L 488 220 C 360 250, 160 210, 24 250 Z" fill="url(#glossGrad)" />

  <!-- Brand Text: ezy1 -->
  <g id="brand-text">
    <text x="256" y="295" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-weight="900" 
          font-size="160" 
          letter-spacing="-3">
      <tspan fill="#FFFFFF">ezy</tspan><tspan fill="url(#goldGrad)" font-size="180">1</tspan>
    </text>
  </g>

  <!-- Speed accent pill / underline under ezy1 -->
  <rect x="140" y="338" width="180" height="18" rx="9" fill="url(#goldGrad)" />
  <circle cx="116" cy="347" r="9" fill="#FFFFFF" />
  <circle cx="346" cy="347" r="9" fill="url(#goldGrad)" />
  <circle cx="376" cy="347" r="6" fill="#FFFFFF" opacity="0.85" />

  <!-- Dynamic spark above the 1 -->
  <path d="M 408 140 L 415 160 L 435 167 L 415 174 L 408 194 L 401 174 L 381 167 L 401 160 Z" fill="url(#goldGrad)" />
</svg>
